[package]
name = "t00-spike"
version = "0.0.0"
edition = "2021"
build = "build.rs"
[features]
gui = ["dep:tauri", "dep:tauri-build"]
[dependencies]
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tauri = { version = "2", optional = true }
[build-dependencies]
tauri-build = { version = "2", optional = true }
[[bin]]
name = "spike-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]
