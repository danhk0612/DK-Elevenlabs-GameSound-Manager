name: T00-A Windows spike
on:
  push:
    branches: [task/t00-a-technical-spike]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spike:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: 1
    defaults:
      run:
        shell: pwsh
        working-directory: spikes/t00-a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spikes/t00-a/target
          key: t00-windows-${{ hashFiles('spikes/t00-a/Cargo.lock') }}
      - name: Versions and UI
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          rustc -Vv
          cargo -V
          node -v
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build independent entrypoints and GUI
        id: build
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --features gui,custom-protocol --bin spike-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spikes/t00-a/target
          key: t00-windows-${{ hashFiles('spikes/t00-a/Cargo.lock') }}
      - name: Synthetic audio tooling
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Process and file execution checks
        id: core_checks
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source-sha.txt -Encoding utf8
          rustc -Vv | Set-Content evidence/toolchain.txt
          cargo -V | Add-Content evidence/toolchain.txt
          node -v | Add-Content evidence/toolchain.txt
          ffmpeg -buildconf 2>&1 | Set-Content evidence/ffmpeg-buildconf.txt
          python scripts/verify.py --bin target/release --sha $env:GITHUB_SHA --out evidence/windows-automatic.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Opt-in engine lifecycle checks
        if: always() && steps.core_checks.outcome == 'success'
        run: |
          python scripts/lifecycle.py --bin target/release --sha $env:GITHUB_SHA --out evidence/windows-lifecycle.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native named pipe ACL candidate
        if: always() && steps.core_checks.outcome == 'success'
        run: |
          ./scripts/pipe-acl.ps1 -SourceSha $env:GITHUB_SHA -OutFile evidence/windows-pipe-acl.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare native WebView2 driver
        id: webdriver_setup
        if: always() && steps.core_checks.outcome == 'success'
        run: ./scripts/webdriver-setup.ps1
      - name: Real GUI commands close reconnect and media
        if: always() && steps.webdriver_setup.outcome == 'success'
        run: |
          python scripts/gui-webdriver.py --bin target/release --sha $env:GITHUB_SHA --out evidence/windows-gui.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package isolated verification artifact
        if: always()
        run: |
          New-Item -ItemType Directory -Force artifact/scripts | Out-Null
          Copy-Item target/release/spike-*.exe artifact -ErrorAction SilentlyContinue
          Copy-Item scripts/*.py,scripts/*.ps1 artifact/scripts
          Copy-Item Collect-UserResult.ps1,README.md artifact
          Copy-Item evidence/* artifact -ErrorAction SilentlyContinue
          git rev-parse HEAD | Set-Content artifact/source-sha.txt -Encoding utf8
          Get-ChildItem artifact -File -Recurse | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object { $h=Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash)  $($_.FullName.Substring((Resolve-Path artifact).Path.Length+1))" } | Set-Content artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t00-a-windows-${{ github.sha }}
          path: spikes/t00-a/artifact/
          retention-days: 14
