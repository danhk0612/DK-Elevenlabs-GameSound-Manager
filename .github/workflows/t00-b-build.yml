name: GameSound build portable library
on:
  push:
    branches: [task/t00-a-technical-spike]
    paths: ['app/**', 'docs/T01_LOCAL_LIBRARY.md', '.github/workflows/t00-b-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: product-windows-1.100-${{ hashFiles('app/Cargo.lock') }}
      - name: Compile minimal UI
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile independent engine CLI MCP and minimal GUI
        run: |
          cargo build --locked --release --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --features gui,custom-protocol --bin dk-sound-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package development ZIP contents
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item target/release/dk-sound-*.exe artifact
          Copy-Item README.md artifact
          Copy-Item ../docs/T01_LOCAL_LIBRARY.md artifact/LOCAL_LIBRARY.md
          $env:GITHUB_SHA | Set-Content artifact/source-sha.txt -Encoding utf8
          rustc -Vv | Set-Content artifact/toolchain.txt
          Get-ChildItem artifact -File | ForEach-Object { $h=Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash)  $($_.Name)" } | Set-Content artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gamesound-local-library-${{ github.sha }}
          path: app/artifact/
          retention-days: 14
